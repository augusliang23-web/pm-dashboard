name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  root-tests:
    name: root-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - run: npm run test:all

  firestore-rules:
    name: firestore-rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:rules

  pdf-tests:
    name: pdf-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: pdf-service/package-lock.json
      - run: npm ci
        working-directory: pdf-service
      - run: npm test
        working-directory: pdf-service
      - name: PDF deploy script dry-run (registry/script consistency only; no gcloud, no cloud mutation)
        working-directory: pdf-service
        run: |
          node scripts/deploy-pdf.mjs --target uat --dry-run
          node scripts/deploy-pdf.mjs --target production --dry-run
      - name: Build the PDF service image on Linux (no push, no registry, no credentials)
        run: docker build --tag pdf-service-ci:${{ github.sha }} pdf-service
      - name: Container smoke test (local-mode contract; no external emulator or credentials)
        run: |
          set -e
          container_id=$(docker run -d \
            -e PDF_ENVIRONMENT=local \
            -e FIREBASE_PROJECT_ID=pdf-service-ci-smoke \
            -e FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 \
            -p 8123:8080 \
            pdf-service-ci:${{ github.sha }})
          trap 'docker logs "$container_id" || true; docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT

          ready=""
          for _ in $(seq 1 20); do
            if curl -s -o /dev/null http://127.0.0.1:8123/; then ready=1; break; fi
            sleep 0.5
          done
          test -n "$ready"

          status=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:8123/v1/reports/project)
          echo "OPTIONS preflight with no Origin header returned HTTP $status (expect 403: CORS rejects an unmatched/absent origin)"
          test "$status" = "403"

          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/)
          echo "Unregistered route returned HTTP $status (expect 404)"
          test "$status" = "404"

          docker stop "$container_id" >/dev/null

  sync-boundary:
    name: sync-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run verify:sync-boundary

  hosting-builds:
    name: hosting-builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: node scripts/build-hosting.mjs --env prod
      - run: node scripts/build-hosting.mjs --env uat
